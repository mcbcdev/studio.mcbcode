<!DOCTYPE html>
<head>
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
    /* ===== theme vars ===== */
    :root {
      --accent: #05ee93;
      --accent-dim: #04b874;
      --bg-0: #141414;      /* activity bar */
      --bg-1: #181818;      /* sidebar */
      --bg-2: #1b1b1b;      /* tab bar / menu bar */
      --bg-3: #1e1e1e;      /* editor bg */
      --bg-4: #202020;      /* modals */
      --bg-5: #232323;      /* active tab / buttons */
      --bg-6: #2a2a2a;      /* hover */
      --bg-7: #2e2e2e;      /* active file/tab bg */
      --border: #2a2a2a;
      --border-strong: #3a3a3a;
      --text-main: #ffffff;
      --text-sub: #bebebe;
      --text-dim: #999999;
      --text-body: #d4d4d4;
      --text-muted: #888888;
      --text-tab: #aaaaaa;
      --radius: 4px; /* only used where absolutely needed (modals, popups) */
      --font-mono: "Consolas", "Courier New", monospace;
    }

    /* ===== kept from original ===== */
    .main-box { 
      font-size: 36px;
      color: var(--text-main);
      text-align: center;
      margin: auto;
      margin-top: 150px;
      margin-bottom: 150px;
    }
    #subtext {
        color: var(--text-sub);
        font-size: 24px;
    }

    /* ===== ide layout ===== */
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: var(--font-mono);
    }

    /* menu bar */
    #menu-bar {
      display: flex;
      align-items: center;
      background: var(--bg-2);
      border-bottom: 1px solid #333;
      padding: 0 8px;
      height: 34px;
      flex-shrink: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    #menu-bar img {
      height: 20px;
      image-rendering: pixelated;
      margin-right: 10px;
    }
    .menu-item {
      position: relative;
      color: var(--text-tab);
      font-size: 13px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .menu-item:hover, .menu-item.open {
      background: var(--bg-6);
      color: var(--text-main);
    }
    .menu-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #252525;
      border: 1px solid var(--border-strong);
      min-width: 180px;
      z-index: 50;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .menu-item.open .menu-dropdown {
      display: block;
    }
    .menu-dropdown div {
      padding: 8px 12px;
      font-size: 13px;
      color: #ddd;
      cursor: pointer;
      white-space: nowrap;
    }
    .menu-dropdown div:hover {
      background: var(--accent);
      color: #06251b;
    }

    /* main workspace: activity bar + sidebar + editor area */
    #workspace {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }

    /* activity bar (far left icon strip) */
    #activity-bar {
      width: 48px;
      flex-shrink: 0;
      background: var(--bg-0);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
    }
    .activity-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 4px;
      opacity: 0.6;
    }
    .activity-icon img {
      width: 20px;
      height: 20px;
      image-rendering: pixelated;
    }
    .activity-icon:hover {
      background: var(--bg-6);
      opacity: 1;
    }
    .activity-icon.active {
      background: var(--bg-7);
      opacity: 1;
      border-left: 2px solid var(--accent);
    }
    #activity-spacer {
      flex: 1;
    }
    #account-icon {
      margin-bottom: 0;
    }

    /* account popup */
    #account-popup {
      display: none;
      position: absolute;
      left: 52px;
      bottom: 8px;
      background: var(--bg-4);
      border: 1px solid var(--border-strong);
      padding: 14px 18px;
      color: #eee;
      font-size: 13px;
      min-width: 160px;
      z-index: 60;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    #account-popup.show {
      display: block;
    }
    #account-popup h4 {
      margin: 0 0 4px;
      font-size: 14px;
    }
    #account-popup p {
      margin: 0;
      color: var(--text-dim);
    }

    /* sidebar (resizable) */
    #sidebar-wrap {
      display: flex;
      flex-shrink: 0;
      min-width: 0;
    }
    #sidebar {
      width: 220px;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: 13px;
      color: var(--text-tab);
      background: var(--bg-1);
    }
    /* collapsed state: snapped shut, width 0, no scrollbars */
    #sidebar-wrap.collapsed #sidebar {
      width: 0 !important;
      overflow: hidden;
    }
    #sidebar-wrap.collapsed #sidebar-resizer {
      border-right: 1px solid var(--border);
    }
    #sidebar h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 10px 12px 6px;
      margin: 0;
      white-space: nowrap;
    }
    .file-item {
      padding: 4px 12px 4px 20px;
      cursor: pointer;
      white-space: nowrap;
    }
    .file-item:hover {
      background: var(--bg-6);
    }
    .file-item.active {
      background: var(--bg-7);
      color: var(--text-main);
    }

    /* the drag handle between sidebar and editor */
    #sidebar-resizer {
      width: 4px;
      flex-shrink: 0;
      cursor: col-resize;
      background: var(--bg-1);
      border-right: 1px solid var(--border);
    }
    #sidebar-resizer:hover, #sidebar-resizer.dragging {
      background: var(--accent);
      border-right-color: var(--accent);
    }

    /* editor area = tabs + code area */
    #editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* tab bar */
    #tab-bar {
      display: flex;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text-tab);
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab:hover {
      color: #eee;
    }
    .tab.active {
      background: var(--bg-5);
      color: var(--text-main);
      border-top: 2px solid var(--accent);
    }
    .tab .tab-label[contenteditable="true"] {
      outline: 1px solid var(--accent);
      background: var(--bg-3);
      padding: 0 3px;
      cursor: text;
    }
    .tab .close-btn {
      opacity: 0.6;
      font-size: 12px;
      padding: 0 2px;
    }
    .tab .close-btn:hover {
      opacity: 1;
      background: #444;
    }

    /* code area */
    #code-area {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .code-panel {
      display: none;
      height: 100%;
      width: 100%;
      color: var(--text-body);
      overflow: hidden;
    }
    .code-panel.active {
      display: flex;
    }
    /* line numbers + textarea, no stray padding around the editing area */
    .code-editor {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .line-numbers {
      flex-shrink: 0;
      padding: 0 8px 0 12px;
      background: var(--bg-3);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      text-align: right;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      white-space: pre;
    }
    .code-panel textarea {
      flex: 1;
      width: 100%;
      height: 100%;
      resize: none;
      border: none;
      outline: none;
      background: var(--bg-3);
      color: var(--text-body);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      padding: 0 12px 0 8px;
      margin: 0;
      overflow: auto;
    }

    /* welcome placeholder shown when 0 tabs open */
    #welcome-panel {
      display: none;
      height: 100%;
      width: 100%;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      color: var(--text-main);
    }
    #welcome-panel.show {
      display: flex;
    }
    #welcome-panel img {
      height: 100px;
      image-rendering: pixelated;
      margin-bottom: 10px;
    }
    #welcome-panel p {
      color: var(--text-sub);
      font-size: 20px;
      margin: 0;
    }
    #welcome-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .welcome-btn {
      background: var(--bg-5);
      border: 1px solid var(--border-strong);
      color: #eee;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 14px;
      font-family: var(--font-mono);
    }
    .welcome-btn:hover {
      background: var(--bg-7);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* open file popup */
    #openfile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #openfile-overlay.show {
      display: flex;
    }
    #openfile-box {
      background: var(--bg-4);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 26px 34px;
      text-align: center;
      color: #eee;
      min-width: 260px;
    }
    #openfile-box h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }
    .openfile-choice {
      display: block;
      width: 100%;
      background: var(--bg-7);
      border: 1px solid var(--border-strong);
      color: #eee;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      font-family: var(--font-mono);
      margin-bottom: 10px;
    }
    .openfile-choice:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #06251b;
    }
    #openfile-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
      margin-top: 4px;
      font-family: var(--font-mono);
    }
    #openfile-close:hover {
      color: #eee;
    }

    /* placeholder modal for extensions/themes */
    #placeholder-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #placeholder-overlay.show {
      display: flex;
    }
    #placeholder-box {
      background: var(--bg-4);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 30px 40px;
      text-align: center;
      color: #eee;
      min-width: 260px;
    }
    #placeholder-box h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    #placeholder-box p {
      color: var(--text-dim);
      font-size: 14px;
      margin: 0 0 16px;
    }
    #placeholder-box button {
      background: var(--accent);
      border: none;
      color: #06251b;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font-mono);
      font-weight: bold;
    }
    #placeholder-box button:hover {
      background: var(--accent-dim);
    }
</style>
<body>

  <!-- ===== menu bar ===== -->
  <div id="menu-bar">
    <img src="https://mcbcode.com/img/icons/studio_logo.png" alt="logo">

    <div class="menu-item" data-menu="file">
      File
      <div class="menu-dropdown">
        <div data-action="placeholder">New File</div>
        <div data-action="placeholder">Open File</div>
        <div data-action="placeholder">Save</div>
      </div>
    </div>

    <div class="menu-item" data-menu="edit">
      Edit
      <div class="menu-dropdown">
        <div data-action="placeholder">Undo</div>
        <div data-action="placeholder">Redo</div>
        <div data-action="placeholder">Find</div>
      </div>
    </div>

    <div class="menu-item" data-menu="view">
      View
      <div class="menu-dropdown">
        <div data-action="placeholder">Toggle Sidebar</div>
        <div data-action="placeholder">Toggle Console</div>
      </div>
    </div>

    <div class="menu-item" data-menu="extensions">
      Extensions
      <div class="menu-dropdown">
        <div data-action="placeholder">Browse Extensions</div>
      </div>
    </div>

    <div class="menu-item" data-menu="themes">
      Themes
      <div class="menu-dropdown">
        <div data-action="placeholder">Browse Themes</div>
      </div>
    </div>
  </div>

  <!-- ===== workspace: activity bar + sidebar + editor ===== -->
  <div id="workspace">

    <!-- ===== activity bar (icon strip) ===== -->
    <div id="activity-bar">
      <div class="activity-icon active" data-action="placeholder">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="explorer">
      </div>
      <div class="activity-icon" data-action="placeholder">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="search">
      </div>
      <div class="activity-icon" data-action="placeholder">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="extensions">
      </div>
      <div class="activity-icon" data-action="placeholder">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="settings">
      </div>
      <!-- add more activity icons here, same structure -->

      <div id="activity-spacer"></div>

      <div class="activity-icon" id="account-icon">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="account">
      </div>
      <div id="account-popup">
        <h4>Account</h4>
        <p>coming soon</p>
      </div>
    </div>

    <!-- ===== sidebar / file explorer (resizable) ===== -->
    <div id="sidebar-wrap">
      <div id="sidebar">
        <h3>Explorer</h3>
        <div class="file-item" data-file="tab1" data-label="manifest.json" data-content="// manifest.json content goes here">manifest.json</div>
        <div class="file-item" data-file="tab2" data-label="main.js" data-content="// main.js content goes here">main.js</div>
        <div class="file-item" data-file="tab3" data-label="README.md" data-content="# README.md content goes here">README.md</div>
        <!-- add more file-items here, just give each one a unique data-file value
             that matches a tab/code-panel below -->
      </div>
      <div id="sidebar-resizer"></div>
    </div>

    <!-- ===== editor area: tabs + code ===== -->
    <div id="editor-area">

      <div id="tab-bar">
        <!-- tabs start closed, opened by clicking a file in the sidebar -->
        <!-- example of a tab's structure once opened:
        <div class="tab active" data-tab="tab1">
          <span class="tab-label">manifest.json</span>
          <span class="close-btn" data-close="tab1">&times;</span>
        </div>
        double-clicking .tab-label makes it contenteditable so the user can rename the tab (and its file entry)
        -->
      </div>

      <div id="code-area">
        <div id="welcome-panel" class="show">
          <img src="https://mcbcode.com/img/icons/studio_logo.png" alt="logo">
          <p id="subtext">Welcome to the mcbCode Studio.</p>

          <div id="welcome-buttons">
            <button class="welcome-btn" id="btn-open-file">Open File</button>
            <button class="welcome-btn" id="btn-login">Login</button>
            <button class="welcome-btn" id="btn-new-file">New Blank File</button>
          </div>
        </div>
        <!-- code panels get added here when a file is opened, example:
        <div class="code-panel" data-panel="tab1">
          <div class="code-editor">
            <div class="line-numbers">1</div>
            <textarea>// manifest.json content goes here</textarea>
          </div>
        </div>
        -->
      </div>

    </div>
  </div>

  <!-- ===== coming soon placeholder modal ===== -->
  <div id="placeholder-overlay">
    <div id="placeholder-box">
      <h2>Coming Soon</h2>
      <p>this feature isn't built yet.</p>
      <button id="placeholder-close">Close</button>
    </div>
  </div>

  <!-- ===== open file choice popup ===== -->
  <div id="openfile-overlay">
    <div id="openfile-box">
      <h2>Open File</h2>
      <button class="openfile-choice" id="btn-open-local">Open Local File</button>
      <button class="openfile-choice" id="btn-open-mcbcode">Open mcbCode File</button>
      <button id="openfile-close">Cancel</button>
    </div>
  </div>

  <!-- hidden file input used for "Open Local File" -->
  <input type="file" id="local-file-input" accept=".js,.mcfunction,.txt,.json,.md" style="display:none">

<script>
  // ================= menu bar dropdowns =================
  const menuItems = document.querySelectorAll('.menu-item');

  menuItems.forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = item.classList.contains('open');
      menuItems.forEach(m => m.classList.remove('open'));
      if (!wasOpen) item.classList.add('open');
    });
  });

  // close menus when clicking anywhere else
  document.addEventListener('click', () => {
    menuItems.forEach(m => m.classList.remove('open'));
  });

  // any dropdown item with data-action="placeholder" opens the coming soon modal
  document.querySelectorAll('[data-action="placeholder"]').forEach(el => {
    el.addEventListener('click', () => {
      showPlaceholder();
    });
  });

  // extensions/themes top-level menu items also open placeholder when clicked directly
  document.querySelector('[data-menu="extensions"]').addEventListener('click', showPlaceholder);
  document.querySelector('[data-menu="themes"]').addEventListener('click', showPlaceholder);

  function showPlaceholder() {
    document.getElementById('placeholder-overlay').classList.add('show');
  }
  document.getElementById('placeholder-close').addEventListener('click', () => {
    document.getElementById('placeholder-overlay').classList.remove('show');
  });

  // ================= welcome panel + tab state =================
  const tabBar = document.getElementById('tab-bar');
  const codeArea = document.getElementById('code-area');
  const welcomePanel = document.getElementById('welcome-panel');

  function updateWelcomeVisibility() {
    const anyTabs = document.querySelectorAll('.tab').length > 0;
    welcomePanel.classList.toggle('show', !anyTabs);
  }

  // ================= tabs: switching =================
  function activateTab(id) {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === id);
    });
    document.querySelectorAll('.code-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.panel === id);
    });
    document.querySelectorAll('.file-item').forEach(f => {
      f.classList.toggle('active', f.dataset.file === id);
    });
    updateWelcomeVisibility();
  }

  // ================= line numbers helper =================
  function syncLineNumbers(textarea, lineNumbersEl) {
    const lineCount = textarea.value.split('\n').length;
    let nums = '';
    for (let i = 1; i <= lineCount; i++) nums += i + '\n';
    lineNumbersEl.textContent = nums.trim() === '' ? '1' : nums;
  }

  // ================= tabs: opening (from sidebar) =================
  function openTab(id, label, content) {
    let tab = document.querySelector(`.tab[data-tab="${id}"]`);

    if (!tab) {
      // build the tab
      tab = document.createElement('div');
      tab.className = 'tab';
      tab.dataset.tab = id;
      tab.innerHTML = `<span class="tab-label">${label}</span><span class="close-btn" data-close="${id}">&times;</span>`;
      tabBar.appendChild(tab);

      // build the matching code panel: line numbers + editable textarea, no extra padding around it
      const panel = document.createElement('div');
      panel.className = 'code-panel';
      panel.dataset.panel = id;

      const editorWrap = document.createElement('div');
      editorWrap.className = 'code-editor';

      const lineNumbers = document.createElement('div');
      lineNumbers.className = 'line-numbers';

      const textarea = document.createElement('textarea');
      textarea.value = content;
      textarea.spellcheck = false;

      editorWrap.appendChild(lineNumbers);
      editorWrap.appendChild(textarea);
      panel.appendChild(editorWrap);
      codeArea.appendChild(panel);

      syncLineNumbers(textarea, lineNumbers);
      textarea.addEventListener('input', () => syncLineNumbers(textarea, lineNumbers));
      textarea.addEventListener('scroll', () => {
        lineNumbers.scrollTop = textarea.scrollTop;
      });

      attachTabEvents(tab);
      attachCloseEvent(tab.querySelector('.close-btn'));
      attachRenameEvent(tab.querySelector('.tab-label'), id);
    }

    activateTab(id);
  }

  // generates a unique tab id for files opened outside the sidebar (local files, new blank files)
  let dynamicTabCounter = 1;
  function nextDynamicId() {
    return `dyn${dynamicTabCounter++}`;
  }

  function attachTabEvents(tab) {
    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('close-btn')) return;
      if (e.target.isContentEditable) return;
      activateTab(tab.dataset.tab);
    });
  }

  // ================= tabs: renaming (double-click the label) =================
  function attachRenameEvent(labelEl, id) {
    labelEl.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      labelEl.contentEditable = 'true';
      labelEl.focus();
      document.execCommand('selectAll', false, null);
    });

    function finishRename() {
      labelEl.contentEditable = 'false';
      const newName = labelEl.textContent.trim() || 'untitled';
      labelEl.textContent = newName;

      // keep the sidebar file entry (if any) in sync with the new name
      const fileItem = document.querySelector(`.file-item[data-file="${id}"]`);
      if (fileItem) {
        fileItem.textContent = newName;
        fileItem.dataset.label = newName;
      }
    }

    labelEl.addEventListener('blur', finishRename);
    labelEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        labelEl.blur();
      }
    });
  }

  // ================= tabs: closing =================
  function attachCloseEvent(btn) {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.close;
      const tab = document.querySelector(`.tab[data-tab="${id}"]`);
      const panel = document.querySelector(`.code-panel[data-panel="${id}"]`);
      const wasActive = tab.classList.contains('active');

      tab.remove();
      if (panel) panel.remove();
      document.querySelector(`.file-item[data-file="${id}"]`)?.classList.remove('active');

      // if the closed tab was active, activate the first remaining tab
      const nextTab = document.querySelector('.tab');
      if (wasActive && nextTab) {
        activateTab(nextTab.dataset.tab);
      } else {
        updateWelcomeVisibility();
      }
    });
  }

  // ================= sidebar: clicking a file opens/activates its tab =================
  document.querySelectorAll('.file-item').forEach(file => {
    file.addEventListener('click', () => {
      const id = file.dataset.file;
      const label = file.dataset.label;
      const content = file.dataset.content;
      openTab(id, label, content);
    });
  });

  updateWelcomeVisibility();

  // ================= account popup =================
  const accountIcon = document.getElementById('account-icon');
  const accountPopup = document.getElementById('account-popup');

  accountIcon.addEventListener('click', (e) => {
    e.stopPropagation();
    accountPopup.classList.toggle('show');
  });
  document.addEventListener('click', () => {
    accountPopup.classList.remove('show');
  });

  // ================= activity bar icons =================
  document.querySelectorAll('.activity-icon[data-action="placeholder"]').forEach(icon => {
    icon.addEventListener('click', () => {
      document.querySelectorAll('.activity-icon[data-action="placeholder"]').forEach(i => i.classList.remove('active'));
      icon.classList.add('active');
      showPlaceholder();
    });
  });

  // ================= welcome panel buttons =================
  const openfileOverlay = document.getElementById('openfile-overlay');
  const localFileInput = document.getElementById('local-file-input');

  // "Open File" button -> shows the local / mcbCode choice popup
  document.getElementById('btn-open-file').addEventListener('click', () => {
    openfileOverlay.classList.add('show');
  });
  document.getElementById('openfile-close').addEventListener('click', () => {
    openfileOverlay.classList.remove('show');
  });

  // "Open Local File" -> triggers the hidden file input
  document.getElementById('btn-open-local').addEventListener('click', () => {
    localFileInput.click();
  });

  // once a local file is picked, read it and open it in a new tab
  localFileInput.addEventListener('change', () => {
    const file = localFileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      const id = nextDynamicId();
      openTab(id, file.name, reader.result);
      openfileOverlay.classList.remove('show');
    };
    reader.readAsText(file);

    // reset so picking the same file again still fires "change"
    localFileInput.value = '';
  });

  // "Open mcbCode File" -> not built yet
  document.getElementById('btn-open-mcbcode').addEventListener('click', () => {
    openfileOverlay.classList.remove('show');
    showPlaceholder();
  });

  // "Login" -> redirect to the account page
  document.getElementById('btn-login').addEventListener('click', () => {
    window.location.href = 'https://mcbcode.com/account?redirectto=https://studio.mcbcode.com';
  });

  // "New Blank File" -> opens an empty scratch tab to start typing in right away
  document.getElementById('btn-new-file').addEventListener('click', () => {
    const id = nextDynamicId();
    openTab(id, 'untitled', '');
  });

  // ================= sidebar resizing + snap-close =================
  const sidebarWrap = document.getElementById('sidebar-wrap');
  const sidebar = document.getElementById('sidebar');
  const sidebarResizer = document.getElementById('sidebar-resizer');

  const SIDEBAR_MIN = 120;   // below this while dragging, it snaps closed
  const SIDEBAR_MAX = 480;
  const SIDEBAR_SNAP_CLOSED_AT = 70; // px width that counts as "small enough to snap shut"
  const SIDEBAR_REOPEN_WIDTH = 220;  // width restored when re-expanded from collapsed

  let isDraggingSidebar = false;

  sidebarResizer.addEventListener('mousedown', (e) => {
    // if collapsed, clicking the resizer re-opens the sidebar instead of dragging from 0
    if (sidebarWrap.classList.contains('collapsed')) {
      sidebarWrap.classList.remove('collapsed');
      sidebar.style.width = SIDEBAR_REOPEN_WIDTH + 'px';
      return;
    }
    isDraggingSidebar = true;
    sidebarResizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDraggingSidebar) return;

    const activityBarWidth = document.getElementById('activity-bar').offsetWidth;
    let newWidth = e.clientX - activityBarWidth;

    if (newWidth < SIDEBAR_SNAP_CLOSED_AT) {
      sidebarWrap.classList.add('collapsed');
      return;
    }
    sidebarWrap.classList.remove('collapsed');
    newWidth = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, newWidth));
    sidebar.style.width = newWidth + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!isDraggingSidebar) return;
    isDraggingSidebar = false;
    sidebarResizer.classList.remove('dragging');
    document.body.style.userSelect = '';
  });
</script>

</body>
</html>
