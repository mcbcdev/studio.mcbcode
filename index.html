<!DOCTYPE html>
<head>
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
    /* ===== kept from original ===== */
    .main-box { 
      font-size: 36px;
      color: #ffffff;
      text-align: center;
      margin: auto;
      margin-top: 150px;
      margin-bottom: 150px;
    }
    #subtext {
        color: #bebebe;
        font-size: 24px;
    }

    /* ===== ide layout ===== */
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    /* menu bar */
    #menu-bar {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
      padding: 0 8px;
      height: 34px;
      flex-shrink: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    #menu-bar img {
      height: 20px;
      image-rendering: pixelated;
      margin-right: 10px;
    }
    .menu-item {
      position: relative;
      color: #cfcfcf;
      font-size: 13px;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
    }
    .menu-item:hover, .menu-item.open {
      background: #333;
      color: #fff;
    }
    .menu-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #252525;
      border: 1px solid #3a3a3a;
      min-width: 180px;
      z-index: 50;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      border-radius: 4px;
      overflow: hidden;
    }
    .menu-item.open .menu-dropdown {
      display: block;
    }
    .menu-dropdown div {
      padding: 8px 12px;
      font-size: 13px;
      color: #ddd;
      cursor: pointer;
      white-space: nowrap;
    }
    .menu-dropdown div:hover {
      background: #3a7bd5;
      color: #fff;
    }

    /* main workspace: activity bar + sidebar + editor area */
    #workspace {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }

    /* activity bar (far left icon strip) */
    #activity-bar {
      width: 48px;
      flex-shrink: 0;
      background: #141414;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
    }
    .activity-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      opacity: 0.6;
    }
    .activity-icon img {
      width: 20px;
      height: 20px;
      image-rendering: pixelated;
    }
    .activity-icon:hover {
      background: #262626;
      opacity: 1;
    }
    .activity-icon.active {
      background: #2e2e2e;
      opacity: 1;
      border-left: 2px solid #3a7bd5;
    }
    #activity-spacer {
      flex: 1;
    }
    #account-icon {
      margin-bottom: 0;
    }

    /* account popup */
    #account-popup {
      display: none;
      position: absolute;
      left: 52px;
      bottom: 8px;
      background: #202020;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 14px 18px;
      color: #eee;
      font-size: 13px;
      min-width: 160px;
      z-index: 60;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    #account-popup.show {
      display: block;
    }
    #account-popup h4 {
      margin: 0 0 4px;
      font-size: 14px;
    }
    #account-popup p {
      margin: 0;
      color: #999;
    }

    /* sidebar */
    #sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #181818;
      border-right: 1px solid #2a2a2a;
      overflow-y: auto;
      font-size: 13px;
      color: #cfcfcf;
    }
    #sidebar h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      padding: 10px 12px 6px;
      margin: 0;
    }
    .file-item {
      padding: 4px 12px 4px 20px;
      cursor: pointer;
      white-space: nowrap;
    }
    .file-item:hover {
      background: #2a2a2a;
    }
    .file-item.active {
      background: #2e2e2e;
      color: #fff;
    }

    /* editor area = tabs + code area */
    #editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* tab bar */
    #tab-bar {
      display: flex;
      background: #1b1b1b;
      border-bottom: 1px solid #2a2a2a;
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #aaa;
      background: #1b1b1b;
      border-right: 1px solid #2a2a2a;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab:hover {
      color: #eee;
    }
    .tab.active {
      background: #232323;
      color: #fff;
      border-top: 2px solid #3a7bd5;
    }
    .tab .close-btn {
      opacity: 0.6;
      font-size: 12px;
      padding: 0 2px;
      border-radius: 3px;
    }
    .tab .close-btn:hover {
      opacity: 1;
      background: #444;
    }

    /* code area */
    #code-area {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .code-panel {
      display: none;
      height: 100%;
      width: 100%;
      padding: 16px;
      color: #d4d4d4;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 14px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .code-panel.active {
      display: block;
    }

    /* welcome placeholder shown when 0 tabs open */
    #welcome-panel {
      display: none;
      height: 100%;
      width: 100%;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      color: #ffffff;
    }
    #welcome-panel.show {
      display: flex;
    }
    #welcome-panel img {
      height: 100px;
      image-rendering: pixelated;
      margin-bottom: 10px;
    }
    #welcome-panel p {
      color: #bebebe;
      font-size: 20px;
      margin: 0;
    }

    /* placeholder modal for extensions/themes */
    #placeholder-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #placeholder-overlay.show {
      display: flex;
    }
    #placeholder-box {
      background: #202020;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 30px 40px;
      text-align: center;
      color: #eee;
      min-width: 260px;
    }
    #placeholder-box h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    #placeholder-box p {
      color: #999;
      font-size: 14px;
      margin: 0 0 16px;
    }
    #placeholder-box button {
      background: #3a7bd5;
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #placeholder-box button:hover {
      background: #2f66b3;
    }
</style>
<body>

  <!-- ===== menu bar ===== -->
  <div id="menu-bar">
    <img src="https://mcbcode.com/img/icons/studio_logo.png" alt="logo">

    <div class="menu-item" data-menu="file">
      File
      <div class="menu-dropdown">
        <div data-action="placeholder">New File</div>
        <div data-action="placeholder">Open File</div>
        <div data-action="placeholder">Save</div>
      </div>
    </div>

    <div class="menu-item" data-menu="edit">
      Edit
      <div class="menu-dropdown">
        <div data-action="placeholder">Undo</div>
        <div data-action="placeholder">Redo</div>
        <div data-action="placeholder">Find</div>
      </div>
    </div>

    <div class="menu-item" data-menu="view">
      View
      <div class="menu-dropdown">
        <div data-action="placeholder">Toggle Sidebar</div>
        <div data-action="placeholder">Toggle Console</div>
      </div>
    </div>

    <div class="menu-item" data-menu="extensions">
      Extensions
      <div class="menu-dropdown">
        <div data-action="placeholder">Browse Extensions</div>
      </div>
    </div>

    <div class="menu-item" data-menu="themes">
      Themes
      <div class="menu-dropdown">
        <div data-action="placeholder">Browse Themes</div>
      </div>
    </div>
  </div>

  <!-- ===== workspace: activity bar + sidebar + editor ===== -->
  <div id="workspace">

    <!-- ===== activity bar (icon strip) ===== -->
    <div id="activity-bar">
      <div class="activity-icon active" data-action="placeholder">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="explorer">
      </div>
      <div class="activity-icon" data-action="placeholder">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="search">
      </div>
      <div class="activity-icon" data-action="placeholder">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="extensions">
      </div>
      <div class="activity-icon" data-action="placeholder">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="settings">
      </div>
      <!-- add more activity icons here, same structure -->

      <div id="activity-spacer"></div>

      <div class="activity-icon" id="account-icon">
        <img src="https://mcbcode.com/img/icons/blank-transparent.png" alt="account">
      </div>
      <div id="account-popup">
        <h4>Account</h4>
        <p>coming soon</p>
      </div>
    </div>

    <!-- ===== sidebar / file explorer ===== -->
    <div id="sidebar">
      <h3>Explorer</h3>
      <div class="file-item" data-file="tab1" data-label="manifest.json" data-content="// manifest.json content goes here">manifest.json</div>
      <div class="file-item" data-file="tab2" data-label="main.js" data-content="// main.js content goes here">main.js</div>
      <div class="file-item" data-file="tab3" data-label="README.md" data-content="# README.md content goes here">README.md</div>
      <!-- add more file-items here, just give each one a unique data-file value
           that matches a tab/code-panel below -->
    </div>

    <!-- ===== editor area: tabs + code ===== -->
    <div id="editor-area">

      <div id="tab-bar">
        <!-- tabs start closed, opened by clicking a file in the sidebar -->
        <!-- example of a tab's structure once opened:
        <div class="tab active" data-tab="tab1">
          <span>manifest.json</span>
          <span class="close-btn" data-close="tab1">&times;</span>
        </div>
        -->
      </div>

      <div id="code-area">
        <div id="welcome-panel" class="show">
          <img src="https://mcbcode.com/img/icons/studio_logo.png" alt="logo">
          <p id="subtext">Welcome to the mcbCode Studio.</p>
        </div>
        <!-- code panels get added here when a file is opened, example:
        <div class="code-panel" data-panel="tab1">// manifest.json content goes here</div>
        -->
      </div>

    </div>
  </div>

  <!-- ===== coming soon placeholder modal ===== -->
  <div id="placeholder-overlay">
    <div id="placeholder-box">
      <h2>Coming Soon</h2>
      <p>this feature isn't built yet.</p>
      <button id="placeholder-close">Close</button>
    </div>
  </div>

<script>
  // ================= menu bar dropdowns =================
  const menuItems = document.querySelectorAll('.menu-item');

  menuItems.forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = item.classList.contains('open');
      menuItems.forEach(m => m.classList.remove('open'));
      if (!wasOpen) item.classList.add('open');
    });
  });

  // close menus when clicking anywhere else
  document.addEventListener('click', () => {
    menuItems.forEach(m => m.classList.remove('open'));
  });

  // any dropdown item with data-action="placeholder" opens the coming soon modal
  document.querySelectorAll('[data-action="placeholder"]').forEach(el => {
    el.addEventListener('click', () => {
      showPlaceholder();
    });
  });

  // extensions/themes top-level menu items also open placeholder when clicked directly
  document.querySelector('[data-menu="extensions"]').addEventListener('click', showPlaceholder);
  document.querySelector('[data-menu="themes"]').addEventListener('click', showPlaceholder);

  function showPlaceholder() {
    document.getElementById('placeholder-overlay').classList.add('show');
  }
  document.getElementById('placeholder-close').addEventListener('click', () => {
    document.getElementById('placeholder-overlay').classList.remove('show');
  });

  // ================= welcome panel + tab state =================
  const tabBar = document.getElementById('tab-bar');
  const codeArea = document.getElementById('code-area');
  const welcomePanel = document.getElementById('welcome-panel');

  function updateWelcomeVisibility() {
    const anyTabs = document.querySelectorAll('.tab').length > 0;
    welcomePanel.classList.toggle('show', !anyTabs);
  }

  // ================= tabs: switching =================
  function activateTab(id) {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === id);
    });
    document.querySelectorAll('.code-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.panel === id);
    });
    document.querySelectorAll('.file-item').forEach(f => {
      f.classList.toggle('active', f.dataset.file === id);
    });
    updateWelcomeVisibility();
  }

  // ================= tabs: opening (from sidebar) =================
  function openTab(id, label, content) {
    let tab = document.querySelector(`.tab[data-tab="${id}"]`);

    if (!tab) {
      // build the tab
      tab = document.createElement('div');
      tab.className = 'tab';
      tab.dataset.tab = id;
      tab.innerHTML = `<span>${label}</span><span class="close-btn" data-close="${id}">&times;</span>`;
      tabBar.appendChild(tab);

      // build the matching code panel
      const panel = document.createElement('div');
      panel.className = 'code-panel';
      panel.dataset.panel = id;
      panel.textContent = content;
      codeArea.appendChild(panel);

      attachTabEvents(tab);
      attachCloseEvent(tab.querySelector('.close-btn'));
    }

    activateTab(id);
  }

  function attachTabEvents(tab) {
    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('close-btn')) return;
      activateTab(tab.dataset.tab);
    });
  }

  // ================= tabs: closing =================
  function attachCloseEvent(btn) {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.close;
      const tab = document.querySelector(`.tab[data-tab="${id}"]`);
      const panel = document.querySelector(`.code-panel[data-panel="${id}"]`);
      const wasActive = tab.classList.contains('active');

      tab.remove();
      if (panel) panel.remove();
      document.querySelector(`.file-item[data-file="${id}"]`)?.classList.remove('active');

      // if the closed tab was active, activate the first remaining tab
      const nextTab = document.querySelector('.tab');
      if (wasActive && nextTab) {
        activateTab(nextTab.dataset.tab);
      } else {
        updateWelcomeVisibility();
      }
    });
  }

  // ================= sidebar: clicking a file opens/activates its tab =================
  document.querySelectorAll('.file-item').forEach(file => {
    file.addEventListener('click', () => {
      const id = file.dataset.file;
      const label = file.dataset.label;
      const content = file.dataset.content;
      openTab(id, label, content);
    });
  });

  updateWelcomeVisibility();

  // ================= account popup =================
  const accountIcon = document.getElementById('account-icon');
  const accountPopup = document.getElementById('account-popup');

  accountIcon.addEventListener('click', (e) => {
    e.stopPropagation();
    accountPopup.classList.toggle('show');
  });
  document.addEventListener('click', () => {
    accountPopup.classList.remove('show');
  });

  // ================= activity bar icons =================
  document.querySelectorAll('.activity-icon[data-action="placeholder"]').forEach(icon => {
    icon.addEventListener('click', () => {
      document.querySelectorAll('.activity-icon[data-action="placeholder"]').forEach(i => i.classList.remove('active'));
      icon.classList.add('active');
      showPlaceholder();
    });
  });
</script>

</body>
</html>
